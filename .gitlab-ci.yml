# Builds the standalone distribution and publishes it as a GitLab Release.
#
#  - branches "release/*"  -> build + test; archives kept as job artifacts
#  - tags "vX.Y.Z[-...]"   -> build + test, archives uploaded to the Generic Package Registry
#                             (permanent download links) and a Release created from them
#
# The tag must match the Maven project version (tag v1.0.0 <-> <version>1.0.0</version>).

stages:
  - build
  - release

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-B -ntp"
  DIST_NAME: "hazelcast-inspector"

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_PIPELINE_SOURCE == "web"'

build-distribution:
  stage: build
  image: maven:3.9.9-eclipse-temurin-21
  cache:
    key:
      files:
        - pom.xml
        - frontend/package-lock.json
    paths:
      - .m2/repository
      - frontend/node
  before_script:
    - apt-get update -qq && apt-get install -y -qq unzip > /dev/null
  script:
    - VERSION=$(mvn $MAVEN_CLI_OPTS -q help:evaluate -Dexpression=project.version -DforceStdout)
    - echo "Project version $VERSION"
    - |
      if [ -n "$CI_COMMIT_TAG" ] && [ "${CI_COMMIT_TAG#v}" != "$VERSION" ]; then
        echo "Tag $CI_COMMIT_TAG does not match project version $VERSION"; exit 1
      fi
    - mvn $MAVEN_CLI_OPTS clean verify -Prelease
    - ZIP="target/$DIST_NAME-$VERSION-release.zip"
    - |
      for entry in $DIST_NAME.jar config/application.yml lib/README-LIBS.txt bin/start.sh bin/start.bat LICENSE README.md; do
        unzip -l "$ZIP" | grep -q "/$entry\$" || { echo "$entry missing in $ZIP"; exit 1; }
      done
    - unzip -p "$ZIP" "*/$DIST_NAME.jar" > /tmp/app.jar
    - unzip -l /tmp/app.jar | grep -q "BOOT-INF/classes/static/index.html"
    - echo "VERSION=$VERSION" >> build.env
  artifacts:
    name: "$DIST_NAME-$CI_COMMIT_REF_SLUG"
    paths:
      - target/$DIST_NAME-*-release.zip
      - target/$DIST_NAME-*-release.tar.gz
    reports:
      dotenv: build.env
      junit:
        - target/surefire-reports/TEST-*.xml
    expire_in: 30 days

upload-packages:
  stage: release
  image: curlimages/curl:8.10.1
  needs:
    - job: build-distribution
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${DIST_NAME}/${VERSION}"
    - |
      for file in target/$DIST_NAME-$VERSION-release.zip target/$DIST_NAME-$VERSION-release.tar.gz; do
        curl --fail --show-error --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$file" "${PACKAGE_URL}/$(basename "$file")"
      done

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build-distribution
      artifacts: true
    - job: upload-packages
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating release $CI_COMMIT_TAG for version $VERSION"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Hazelcast Inspector $CI_COMMIT_TAG"
    description: |
      Standalone distribution of Hazelcast Inspector (TsarevnaCache) — backend and web UI in one jar.

      Unpack the archive, adjust `config/application.yml` (cluster members, admin password) and start
      `bin/start.sh` (Linux/macOS) or `bin\start.bat` (Windows). Requires Java 17+. Put jars with your
      DTO classes into `lib/`.

      Licensed under the PolyForm Noncommercial License 1.0.0 — commercial use requires permission.
    assets:
      links:
        - name: "$DIST_NAME-$VERSION-release.zip"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${DIST_NAME}/${VERSION}/${DIST_NAME}-${VERSION}-release.zip"
          link_type: package
        - name: "$DIST_NAME-$VERSION-release.tar.gz"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${DIST_NAME}/${VERSION}/${DIST_NAME}-${VERSION}-release.tar.gz"
          link_type: package
