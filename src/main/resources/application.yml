server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  servlet:
    session:
      timeout: 30m
      cookie:
        name: TSAREVNA_SESSION
        http-only: true
        same-site: strict
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: tsarevna-cache
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  main:
    banner-mode: off

admin:
  # ---------------------------------------------------------------------------
  # Built-in administrator account.
  # The password may be plain text or carry a Spring Security encoder prefix,
  # e.g. "{bcrypt}$2a$10$..." or "{noop}secret". Plain text is treated as {noop}.
  # ALWAYS override the defaults via environment variables in real deployments.
  # ---------------------------------------------------------------------------
  security:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}
    cors:
      # Only needed when the UI is served from a different origin than the API.
      # The Vite dev server proxies /api, so this normally stays empty.
      allowed-origins: ${ADMIN_CORS_ORIGINS:}
    # Brute-force protection of the login endpoint (per client address).
    login-throttle:
      max-failures: 10
      window: 5m

  # ---------------------------------------------------------------------------
  # Hazelcast client connection.
  # ---------------------------------------------------------------------------
  hazelcast:
    cluster-name: ${HZ_CLUSTER_NAME:dev}
    # Comma separated list of member addresses (host:port).
    members: ${HZ_MEMBERS:127.0.0.1:5701}
    instance-name: tsarevna-admin-client
    labels:
      - tsarevna-admin
    smart-routing: true
    connection-timeout: 5s
    invocation-timeout: 60s
    heartbeat-interval: 5s
    heartbeat-timeout: 60s
    # true: the application starts even if the cluster is unreachable and
    # connects in the background (the UI shows the cluster as Offline).
    async-start: true
    # ON | OFF | ASYNC
    reconnect-mode: ASYNC
    retry:
      initial-backoff: 1s
      max-backoff: 30s
      multiplier: 1.5
      jitter: 0.2
      # Give up connecting after this period. Leave unset to retry forever.
      # cluster-connect-timeout: 5m

    serialization:
      # Extra jars or directories (every *.jar inside is added) that contain
      # your DTO classes, factories and serializers. They are loaded by an
      # isolated class loader used by the Hazelcast client and the inspector.
      dto-classpath: ${HZ_DTO_CLASSPATH:}
      # Classes to register for Compact serialization (zero-config reflective).
      compact-classes: []
      # Fully qualified names of com.hazelcast.nio.serialization.compact.CompactSerializer implementations.
      compact-serializers: []
      # factoryId -> fully qualified DataSerializableFactory class name.
      data-serializable-factories: {}
      # Factory ids answered by the dynamic DTO schema registry (IdentifiedDataSerializable
      # DTOs read from pasted Java sources, no jars needed). A class configured above for
      # the same id becomes the fallback for class ids without a schema.
      dynamic-factory-ids: [1]
      # factoryId -> fully qualified PortableFactory class name.
      portable-factories: {}
      portable-version: 0
      # Custom StreamSerializer / ByteArraySerializer registrations.
      custom-serializers: []
      #  - type-class: com.example.Money
      #    serializer-class: com.example.MoneySerializer

  # ---------------------------------------------------------------------------
  # Dynamic IdentifiedDataSerializable DTO schemas (managed via /api/schemas).
  # ---------------------------------------------------------------------------
  dto-schemas:
    # Relative paths resolve against the working directory (the distribution root).
    file: ${DTO_SCHEMAS_FILE:./config/dto-schemas.json}

  # ---------------------------------------------------------------------------
  # Value inspector (JSON rendering of keys/values and typed writes).
  # ---------------------------------------------------------------------------
  inspector:
    # Length of the single-line value preview shown in tables.
    preview-length: 160
    # Packages that may not be used as CLASS targets when writing values.
    denied-class-prefixes:
      - java.
      - javax.
      - jdk.
      - sun.
      - com.sun.
      - org.springframework.
      - com.hazelcast.
      - io.github.noproblem2000.tsarevnacache.

  # ---------------------------------------------------------------------------
  # Cluster / data explorer limits.
  # ---------------------------------------------------------------------------
  explorer:
    operation-timeout: 15s
    # Member metrics (map statistics, heap) are cached between UI refreshes.
    metrics-cache-ttl: 3s
    max-page-size: 200
    # Partitions scanned in parallel while filling an unfiltered IMap page.
    scan-parallelism: 32
    # Items shown for queues, sets, lists, multimaps and replicated maps.
    max-preview-items: 50
    # Queues/sets/multimaps/replicated maps larger than this are not fetched
    # (clients can only read them as a whole).
    max-fetch-items: 10000

logging:
  level:
    root: INFO
    com.hazelcast: INFO
    io.github.noproblem2000.tsarevnacache: INFO
