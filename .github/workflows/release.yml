# Builds the standalone distribution and publishes it to GitHub Releases.
#
#  - push to "release" or "release/**"  -> build + test, archives attached to the workflow run
#  - push of a tag "v*" (e.g. v1.0.0)    -> build + test + GitHub Release with the archives
#
# The tag must match the Maven project version (tag v1.0.0 <-> <version>1.0.0</version>);
# scripts/create-release.sh takes care of both.
name: Release

on:
  push:
    branches:
      - release
      - "release/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache Node.js and npm downloads
        uses: actions/cache@v4
        with:
          path: |
            frontend/node
            ~/.npm
          key: frontend-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json', 'pom.xml') }}
          restore-keys: frontend-${{ runner.os }}-

      - name: Read project version
        id: version
        run: |
          ./mvnw -B -q --version > /dev/null   # let the wrapper download Maven before capturing output
          VERSION=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Project version: $VERSION"

      - name: Tag must match the project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Build, test and package (-Prelease)
        run: ./mvnw -B -ntp clean verify -Prelease

      - name: Build native launcher (mingw-w64)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 > /dev/null
          bash src/launcher/build-native.sh "${{ steps.version.outputs.version }}" target/HazelcastInspector-native.exe

      - name: Verify the distribution
        run: |
          set -eu
          ZIP=$(ls target/hazelcast-inspector-*-release.zip)
          unzip -l "$ZIP"
          for entry in HazelcastInspector.exe HazelcastInspector.l4j.ini hazelcast-inspector.jar config/application.yml lib/README-LIBS.txt bin/start.sh bin/start.bat LICENSE README.md; do
            unzip -l "$ZIP" | grep -q "/$entry\$" || { echo "::error::$entry missing in $ZIP"; exit 1; }
          done
          unzip -p "$ZIP" "*/hazelcast-inspector.jar" > /tmp/app.jar
          unzip -l /tmp/app.jar | grep -q "BOOT-INF/classes/static/index.html" || { echo "::error::UI bundle missing in the jar"; exit 1; }

      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: hazelcast-inspector-${{ steps.version.outputs.version }}
          path: |
            target/hazelcast-inspector-*-release.zip
            target/hazelcast-inspector-*-release.tar.gz
            target/HazelcastInspector-native.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          name: hazelcast-inspector-${{ needs.build.outputs.version }}
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Hazelcast Inspector ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/hazelcast-inspector-*-release.zip
            dist/hazelcast-inspector-*-release.tar.gz
            dist/HazelcastInspector-native.exe
          body: |
            Standalone distribution of Hazelcast Inspector (TsarevnaCache) — backend and web UI in one jar.

            **Run:** unpack the archive, adjust `config/application.yml` (cluster members, admin password),
            then start `HazelcastInspector.exe` (Windows, no cmd.exe needed), `bin\start.bat` (Windows)
            or `bin/start.sh` (Linux/macOS). Requires Java 17+ (or a JRE unpacked into `jre/`).
            Put jars with your DTO classes into `lib/`.

            `HazelcastInspector-native.exe` is an optional drop-in replacement for `HazelcastInspector.exe`
            (17 KB, plain Win32 C launcher that also stops Java when the launcher is killed): rename it to
            `HazelcastInspector.exe` and put it into the unpacked folder.

            Licensed under the PolyForm Noncommercial License 1.0.0 — commercial use requires permission.
