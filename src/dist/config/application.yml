# =============================================================================
#  Hazelcast Inspector (TsarevnaCache) - external configuration
#
#  This file is loaded on top of the defaults built into hazelcast-inspector.jar
#  (HazelcastInspector.exe, bin/start.sh and bin/start.bat start the service in the
#  distribution root with --spring.config.location=optional:classpath:/,optional:file:./config/).
#  Only the settings below are usually changed; every other property of the
#  built-in application.yml can be overridden here as well.
#
#  ${NAME:default} reads the environment variable NAME and falls back to the
#  default, so the same file works for containers and for local installs.
# =============================================================================

server:
  port: ${SERVER_PORT:8080}
  # Uncomment when the service is only reachable through HTTPS (TLS terminating proxy):
  # servlet:
  #   session:
  #     cookie:
  #       secure: true
  # Uncomment behind a reverse proxy that sets X-Forwarded-* headers:
  # forward-headers-strategy: native

admin:
  # ---------------------------------------------------------------------------
  # Administrator account - CHANGE THE PASSWORD before exposing the service.
  # Plain text or an encoded value such as "{bcrypt}$2a$10$...".
  # ---------------------------------------------------------------------------
  security:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}

  # ---------------------------------------------------------------------------
  # Hazelcast cluster to connect to.
  # ---------------------------------------------------------------------------
  hazelcast:
    cluster-name: ${HZ_CLUSTER_NAME:dev}
    # Comma separated host:port list of (some of) the cluster members.
    members: ${HZ_MEMBERS:127.0.0.1:5701}

    # Custom DTOs (see README.md, "Working with Custom DTOs"):
    #  1. IdentifiedDataSerializable DTOs: no jar needed, add them in the web UI
    #     under "DTO Schemas" (stored in config/dto-schemas.json).
    #  2. Jars placed in ../lib are on the classpath; factories with a
    #     FACTORY_ID constant are registered automatically. Register everything
    #     else exactly as in your application's own Hazelcast configuration:
    serialization:
      # Factory ids decoded by the DTO Schema Studio.
      dynamic-factory-ids: [1]
      auto-register-factories: true
      compact-serializers: []
      #  - com.example.serialization.MoneyCompactSerializer
      data-serializable-factories: {}
      #  1000: com.example.serialization.BillingDataSerializableFactory
      portable-factories: {}
      #  2000: com.example.serialization.LegacyPortableFactory
      custom-serializers: []
      #  - type-class: com.example.Money
      #    serializer-class: com.example.serialization.MoneyStreamSerializer

  # ---------------------------------------------------------------------------
  # DTO Schema Studio registry (share it with your team, e.g. via git).
  # ---------------------------------------------------------------------------
  dto-schemas:
    file: ${DTO_SCHEMAS_FILE:./config/dto-schemas.json}

  # ---------------------------------------------------------------------------
  # Healthcheck & advisor (runs every minute; see README "Healthcheck").
  # ---------------------------------------------------------------------------
  healthcheck:
    enabled: ${HEALTHCHECK_ENABLED:true}
    ignores-file: ${HEALTHCHECK_IGNORES_FILE:./config/healthcheck-ignores.json}
    # thresholds:
    #   unbounded-min-entries: 1000
    #   unbounded-warning-memory: 50MB
    #   unbounded-critical-memory: 250MB
    #   latency-ms: 25
    #   queue-backlog: 5000

# Write a log file next to the distribution (optional):
# logging:
#   file:
#     name: logs/hazelcast-inspector.log
